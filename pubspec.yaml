name: anibee
description: "aniBee — personal iOS anime app. Miruro-linked, AniList-powered."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # libmpv player (same engine as Zeus): media_kit + video UI + iOS libs.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  shared_preferences: ^2.5.4
  local_auth: ^3.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/providers.json
