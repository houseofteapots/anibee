# AniBee — unsigned iOS IPA build for sideloading (ESign / SideStore).
#
# Personal anime app (iOS only). Adapted from the Zeus
# .github/workflows/ios.yml pattern: Flutter stable, Xcode latest, build
# with --no-codesign, zip the .app into an unsigned .ipa.
#
# No code signing anywhere: the IPA is unsigned and the user signs it with
# ESign, exactly like the MLBB IPA and Zeus. No secrets are used.
#
# Delivery: the IPA is published as a Release asset (v0.1.0) AND uploaded
# as a workflow artifact. The Release path exists because the Actions
# artifact storage quota was hit 2026-11-23 (usage recalculates every
# 6-12h) — releases do not count against that quota, so the IPA always
# gets out even while the artifact upload is blocked.
#
# Trigger: every push to main, or manual Run workflow.

name: Build AniBee iOS (Unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  ios:
    name: iOS Build (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          zip -r "AniBee-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Publish IPA to Release v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=$(ls AniBee-*-unsigned.ipa)
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 --clobber "$IPA"
          else
            gh release create v0.1.0 --title "AniBee 0.1.0 (M1)" \
              --notes "AniBee milestone 1 — UI shell + navigation + settings state. Unsigned IPA for eSign sideload." \
              "$IPA"
          fi

      # Best-effort: artifact storage quota was hit 2026-11-23 (usage
      # recalculates every 6-12h). The Release above is the delivery
      # path; this step must not fail the run while quota is blocked.
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AniBee-iOS-unsigned
          path: AniBee-*-unsigned.ipa
          retention-days: 30
